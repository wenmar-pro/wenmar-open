[workspace]
resolver = "3"
members = ["crates/wenmar-vin", "crates/wenmar-vehicles", "crates/open-data", "crates/open-server", "crates/wenmar-open-cli"]

[workspace.package]
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/wenmar-pro/wenmar-open"
homepage = "https://open.wenmarpro.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

# Dependencies carry no debug information: it is most of the size of
# `target/`, and backtraces keep file and line for this workspace's own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
