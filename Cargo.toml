[workspace]
resolver = "3"
members = ["crates/wenmar-vin", "crates/wenmar-vehicles", "crates/open-data", "crates/open-server", "crates/wenmar-open-cli", "crates/open-mcp", "crates/wenmar-open-turso", "crates/wenmar-open-db", "crates/wenmar-open-wasm", "crates/shop-math"]

[workspace.package]
# The one version of everything this repository publishes: the three library
# crates, the server, the command-line tool and the npm package in clients/js.
# Change it here, in the three lines for this workspace's own libraries
# below, and in clients/js/package.json. `mise run release-check` fails if
# they disagree. See docs/releasing.md.
version = "0.2.0"
edition = "2024"
rust-version = "1.92"
license = "MIT"
repository = "https://github.com/wenmar-pro/wenmar-open"
homepage = "https://open.wenmarpro.com"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# This workspace's own libraries. A published crate carries this version as
# its requirement on the others, so it is always the version above.
wenmar-vin = { version = "0.2.0", path = "crates/wenmar-vin" }
wenmar-vehicles = { version = "0.2.0", path = "crates/wenmar-vehicles" }
wenmar-open-turso = { version = "0.2.0", path = "crates/wenmar-open-turso" }
wenmar-open-db = { version = "0.2.0", path = "crates/wenmar-open-db" }

# Dependencies carry no debug information: it is most of the size of
# `target/`, and backtraces keep file and line for this workspace's own code.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# The WebAssembly build of crates/wenmar-open-wasm, which clients/js ships.
# Size comes first: "s" was 450 kB, "z" 423 kB and 12 percent slower, and
# 3 was 504 kB. A panic stops the module; there is no unwinding.
[profile.wasm]
inherits = "release"
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
