# [REVIEW] Drafted on 2026-10-12 from the component texts in NHTSA's and Transport Canada's files. Not yet read by a person who knows repair work.
# Components: the parts and systems a recall, a bulletin, a trouble code or a
# job is about. Written by hand for this project; see components.md beside
# this file for the fields and the rules.
#
# The first block is the broad systems. The second is parts a job acts on,
# each under one system. `nhtsa` lists NHTSA component paths: an entry
# covers that path and everything below it. `tc` lists Transport Canada
# system names.
components:
  - id: air-bags
    name: "Air bags"
    nhtsa:
      - "AIR BAGS"
    tc: ["Airbag"]
  - id: brakes
    name: "Brakes"
    nhtsa:
      - "SERVICE BRAKES"
      - "SERVICE BRAKES, HYDRAULIC"
      - "SERVICE BRAKES, AIR"
      - "SERVICE BRAKES, ELECTRIC"
      - "PARKING BRAKE"
      - "AUTOHOLD BRAKE SYSTEM/BRAKE HOLD"
    tc: ["Brakes"]
  - id: driver-assistance
    name: "Driver assistance"
    nhtsa:
      - "BACK OVER PREVENTION"
      - "LANE DEPARTURE"
      - "FORWARD COLLISION AVOIDANCE"
      - "ELECTRONIC STABILITY CONTROL"
      - "ELECTRONIC STABILITY CONTROL (ESC)"
      - "TRACTION CONTROL SYSTEM"
      - "ELECTRICAL SYSTEM:ADAS"
  - id: electrical
    name: "Electrical system"
    nhtsa:
      - "ELECTRICAL SYSTEM"
    tc: ["Electrical"]
  - id: engine
    name: "Engine"
    nhtsa:
      - "ENGINE"
      - "ENGINE AND ENGINE COOLING"
    tc: ["Engine"]
  - id: equipment
    name: "Equipment and accessories"
    nhtsa:
      - "EQUIPMENT"
      - "EQUIPMENT ADAPTIVE/MOBILITY"
    tc: ["Accessories"]
  - id: exhaust-emissions
    name: "Exhaust and emissions"
    nhtsa:
      - "ENGINE AND ENGINE COOLING:EXHAUST SYSTEM"
    tc: ["Emissions"]
  - id: fuel-system
    name: "Fuel system"
    nhtsa:
      - "FUEL SYSTEM, GASOLINE"
      - "FUEL SYSTEM, DIESEL"
      - "FUEL SYSTEM, OTHER"
      - "FUEL/PROPULSION SYSTEM"
    tc: ["Fuel System"]
  - id: hvac
    name: "Heating and air conditioning"
    nhtsa:
      - "VISIBILITY:DEFROSTER/DEFOGGER/HVAC SYSTEM"
      - "EQUIPMENT:APPLIANCE:AIR CONDITIONER"
    tc: ["Heater And Defroster"]
  - id: hybrid-ev
    name: "Hybrid and electric drive"
    nhtsa:
      - "HYBRID PROPULSION SYSTEM"
      - "ELECTRICAL SYSTEM:PROPULSION SYSTEM"
    tc: ["High Voltage"]
  - id: labels-manuals
    name: "Labels and manuals"
    nhtsa:
      - "EQUIPMENT:OTHER:LABELS"
      - "EQUIPMENT:OTHER:OWNERS/SERVICE/OTHER MANUAL"
    tc: ["Label"]
  - id: latches-locks
    name: "Latches and locks"
    nhtsa:
