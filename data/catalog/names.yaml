# Spellings to use for trims and series where vPIC's own spelling is poor.
# The left side is matched without regard to case, after spaces are tidied.
# Changing an entry changes the id of that submodel, so treat it as a rename.
submodels:
  "Si/Si HPT": "Si"
  "DEl SOl S": "del Sol S"
  "DEl SOl Si": "del Sol Si"
  "AERIAL": "Aerial"
  "BI-LOADER": "Bi-Loader"
  "EX-L NAVI": "EX-L Navi"
  "HEAVY RESCUE": "Heavy Rescue"
  "HIGH-CAPACITY PICKUP": "High-Capacity Pickup"
  "MINI-PUMPER": "Mini-Pumper"
  "TRACTOR-CUSTOM": "Tractor-Custom"
  "TYPE-R": "Type-R"
  "WATER TOWER": "Water Tower"
