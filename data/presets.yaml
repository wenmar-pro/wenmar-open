# Trims and engines added where vPIC's own data is thin. Written by hand.
#
# from, to    The model years a preset applies to. `to` may be left out.
# submodels   Added to the trims vPIC lists for that model and year.
# engines     Used only when vPIC lists no engine at all for that model and year.
presets:
  - {make: "Toyota", model: "Camry", from: 2012, submodels: ["LE", "SE", "XLE", "XSE", "TRD"], engines: ["2.5L", "3.5L V6", "2.5L Hybrid"]}
