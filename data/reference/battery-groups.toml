# The case dimensions and the terminal layout of each battery group size,
# for the reference page at `/guides/battery-group-sizes`.
#
# This is the one place a figure of that page is written. The server's build
# reads it (crates/open-server/battery_groups_build.rs) and stops if it is not
# as described here, so a mistake never reaches a visitor.
#
# The table says what a group size is. It does not say which group fits
# which vehicle, and nothing here may: no free source publishes that, and
# the battery makers' fitment guides may not be copied.
#
# Change a figure only as it is printed in a source: a battery maker's own
# published data sheet or dimension chart, read in full. Not a retailer's
# list, not another website's table, and not the data book that is sold.
# Then set `as_of` to the day it was read. No figure is worked out or
# converted by hand; the build converts the units itself.
#
# The schema
#
#   schema                1.
#   name                  What the table is, as the page shows it.
#   as_of                 The day the table was read.
#   confirmed             true only when every group was read from a source
#                         listed in `sources`. The page shows no table that
#                         is not confirmed.
#   missing               What is not yet known. Empty when confirmed.
#   notes                 Optional. Sentences the page shows under the table,
#                         such as what the source says its dimensions are
#                         (the largest a case may be, or one maker's own).
#   to_check              Optional. Weak points in the evidence, for whoever
#                         checks the file next. Not shown.
#   unit                  "mm" or "in": the unit the source prints the
#                         dimensions in.
#   sources               The ids of the pages the figures were read from.
#                         At least one when there is a group.
#   [source.<id>]         A page a figure was read from. `title` says whose
#                         page it is and what it is; `url` is its address.
#                         `archived` is there when the page could not be
#                         read directly and the Internet Archive's copy of
#                         that date (a year, a month or a day) was read.
#   [[group]]             In the order the page lists them.
#                         `name`: the group size as the source names it,
#                         unique.
#                         `length`, `width`, `height`: each exactly as the
#                         source prints it, as text, above zero, with at
#                         most three decimal places, in `unit`. A source
#                         that prints fractions of an inch is read in its
#                         millimetre column, or not used.
#                         `terminals`: one sentence, in your own words,
#                         saying what kind of terminals the group has and
#                         where the positive one is.

schema = 1
name = "Battery group sizes"
as_of = "2026-10-12"
confirmed = false
missing = ["No group size has been read from a published source yet."]
unit = "mm"
sources = []
