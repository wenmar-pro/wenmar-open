# The resistance of copper wire of each gauge, per length, for the wire gauge
# tool at `/tools/wire-gauge`.
#
# This is the one place a figure of that tool is written. The server's build
# reads it (crates/open-server/wire_build.rs) and stops if it is not as
# described here, so a mistake never reaches a visitor.
#
# Change a figure only as it is printed in a source: the wire maker's own
# published data sheet for automotive primary wire, or a national standards
# body's own published copper wire table, read in full. Then set `as_of` to
# the day it was read. No figure is worked out, converted or filled in
# between two gauges by hand; the build converts the units itself.
#
# The schema
#
#   schema                1.
#   name                  What wire the table is for, as the page shows it,
#                         saying which sizing it uses (AWG, SAE gauge, or
#                         square millimetres).
#   as_of                 The day the table was read.
#   confirmed             true only when every gauge was read from a source
#                         listed in `sources`. The page works nothing out for
#                         a table that is not confirmed.
#   missing               What is not yet known. Empty when confirmed.
#   notes                 Optional. Sentences the page shows with a result.
#   conditions            Optional. What the source says the figures hold
#                         for, such as the conductor's temperature or whether
#                         it is stranded. Shown above the form.
#   to_check              Optional. Weak points in the evidence, for whoever
#                         checks the file next. Not shown.
#   unit                  "ohm_per_km" or "ohm_per_1000ft": the unit the
#                         source prints the resistance in.
#   sources               The ids of the pages the figures were read from.
#                         At least one when there is a gauge.
#   [source.<id>]         A page a figure was read from. `title` says whose
#                         page it is and what it is; `url` is its address.
#                         `archived` is there when the page could not be
#                         read directly and the Internet Archive's copy of
#                         that date (a year, a month or a day) was read.
#   [[gauge]]             In order from the thinnest wire to the thickest.
#                         `name`: the gauge as a shop would say it, unique.
#                         `resistance`: the figure exactly as the source
#                         prints it, as text, above zero, with at most four
#                         decimal places, in `unit`. Each gauge must have a
#                         lower resistance than the one before it.

schema = 1
name = "Stranded copper automotive wire"
as_of = "2026-10-12"
confirmed = false
missing = ["The resistance of each gauge has not been read from a published source yet."]
unit = "ohm_per_km"
sources = []
