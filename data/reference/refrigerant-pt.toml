# The pressure at each temperature for each refrigerant on the refrigerant
# chart, `/tools/refrigerant-pt`.
#
# This is the one place a figure of that chart is written. The server's
# build reads it (crates/open-server/refrigerant_build.rs) and stops if it is
# not as described here, so a mistake never reaches a visitor.
#
# Change a figure only as it is printed in a source: the refrigerant
# maker's own published table, read in full. Then set `as_of` to the day it
# was read. No figure is worked out, rounded or filled in between two rows
# by hand; the page works out the other units itself.
#
# The schema
#
#   schema                1.
#   [source.<id>]         A page a figure was read from. `title` says whose
#                         page it is and what it is; `url` is its address.
#                         `archived` is there when the page could not be
#                         read directly and the Internet Archive's copy of
#                         that date (a year, a month or a day) was read.
#   [[refrigerant]]       `key` (small letters, digits and _: the id of its
#                         heading on the page), `name`, `as_of` (the day the
#                         table was read), `confirmed`.
#     confirmed           true only when every row was read from a source
#                         listed in `sources`. The page shows no table for a
#                         refrigerant that is not confirmed.
#     missing             What is not yet known. Empty when confirmed.
#     notes               Sentences the page shows with the table.
#     to_check            Weak points in the evidence, for whoever checks
#                         the file next. Not shown.
#     temperature_unit    "C" or "F": the unit the source prints.
#     pressure_unit       "kPa" or "psi": the unit the source prints.
#     pressure_is         "gauge" or "absolute": what the source measures.
#     sources             The ids of the pages the rows were read from.
#   [[refrigerant.row]]   `temperature` and `pressure`, as text, exactly as
#                         printed, with at most one decimal place and a `-`
#                         in front when below zero. In order of rising
#                         temperature, each temperature higher than the one
#                         before and each pressure not lower.

schema = 1

[[refrigerant]]
key = "r134a"
name = "R-134a"
as_of = "2026-10-12"
confirmed = false
missing = ["The pressure at each temperature has not been read from a published source yet."]
temperature_unit = "C"
pressure_unit = "kPa"
pressure_is = "gauge"
sources = []

[[refrigerant]]
key = "r1234yf"
name = "R-1234yf"
as_of = "2026-10-12"
confirmed = false
missing = ["The pressure at each temperature has not been read from a published source yet."]
temperature_unit = "C"
pressure_unit = "kPa"
pressure_is = "gauge"
sources = []
