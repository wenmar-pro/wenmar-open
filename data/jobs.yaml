# Reviewed 2026-10-30 by the owner (ids and names); includes and excludes
# drafted the same day in our own words. Never a time in this file.
#
# Jobs: the repair jobs a labour time can be about. Written by hand for
# this project; see jobs.md beside this file for the fields and the rules.
# An id never changes once a labour record or a repair order uses it.
status: reviewed
updated: 2026-11-01
jobs:
  - id: oil-service
    name: "Change engine oil and filter"
    system: engine
    components: [engine-oil]
    includes:
      - "raise or reach the vehicle"
      - "drain the engine oil"
      - "replace the oil filter and drain plug washer"
      - "refill with the specified oil"
      - "start the engine and check for leaks and level"
      - "reset the oil life monitor"
    excludes:
      - "tire rotation"
      - "air filter replacement"
      - "multipoint inspection"
  - id: brake-pads-front
    name: "Replace front brake pads"
    system: brakes
    components: [brake-pad]
    related: [brake-pads-and-rotors-front]
    includes:
      - "raise the vehicle and remove the front wheels"
      - "remove the calipers and old pads"
      - "clean and lubricate the slides and pad abutments"
      - "fit new pads and hardware"
      - "refit the calipers and wheels, torque the wheel nuts"
      - "pump up the pedal and road test"
    excludes:
      - "rotor replacement or machining"
      - "brake fluid exchange"
      - "caliper replacement"
  - id: brake-pads-rear
    name: "Replace rear brake pads"
    system: brakes
    components: [brake-pad]
    related: [brake-pads-and-rotors-rear]
    includes:
      - "raise the vehicle and remove the rear wheels"
      - "retract the electric or mechanical parking brake where fitted"
      - "remove the calipers and old pads"
      - "clean and lubricate the slides and pad abutments"
      - "fit new pads and hardware and wind back the pistons"
      - "refit the calipers and wheels, set the parking brake and road test"
    excludes:
      - "rotor replacement or machining"
      - "parking brake shoe service"
      - "brake fluid exchange"
  - id: brake-pads-and-rotors-front
    name: "Replace front brake pads and rotors"
    system: brakes
    components: [brake-pad, brake-rotor]
    related: [brake-pads-front]
    includes:
      - "raise the vehicle and remove the front wheels"
      - "remove the calipers, caliper brackets and old pads"
      - "remove and replace both rotors"
      - "clean and lubricate the slides and pad abutments"
      - "fit new pads and hardware and refit the calipers"
      - "refit the wheels, pump up the pedal, bed in the pads on a road test"
    excludes:
      - "brake fluid exchange"
      - "caliper replacement"
      - "wheel bearing replacement"
  - id: brake-pads-and-rotors-rear
    name: "Replace rear brake pads and rotors"
    system: brakes
    components: [brake-pad, brake-rotor]
    related: [brake-pads-rear]
    includes:
      - "raise the vehicle and remove the rear wheels"
      - "retract the parking brake where fitted"
      - "remove the calipers, caliper brackets and old pads"
      - "remove and replace both rotors"
      - "fit new pads and hardware and refit the calipers"
      - "refit the wheels, set the parking brake, bed in the pads on a road test"
    excludes:
      - "parking brake shoe service"
      - "brake fluid exchange"
      - "caliper replacement"
  - id: brake-fluid-exchange
    name: "Exchange brake fluid"
    system: brakes
    components: [brake-fluid]
    includes:
      - "remove old fluid from the reservoir and refill with fresh fluid"
      - "bleed each wheel in order until clean fluid comes through"
      - "run the ABS bleed routine with a scan tool where the vehicle needs it"
      - "top up, check the pedal and road test"
    excludes:
      - "brake pad or rotor replacement"
      - "brake line repair"
  - id: battery-replacement
    name: "Replace the 12-volt battery"
    system: electrical
    components: [battery]
    includes:
      - "test the old battery and charging system"
      - "fit a memory saver where the vehicle needs one"
      - "remove the hold-down and the old battery"
      - "clean the terminals and tray"
      - "fit the new battery and torque the terminals"
      - "register the battery or relearn windows and idle where the vehicle needs it"
    excludes:
      - "alternator replacement"
      - "cable or terminal replacement"
  - id: alternator-replacement
    name: "Replace the alternator"
    system: electrical
    components: [alternator]
    includes:
      - "disconnect the battery"
      - "remove the drive belt and any parts in the way"
      - "unplug and unbolt the alternator"
      - "fit the new alternator and reconnect it"
      - "refit the belt and parts removed"
      - "test the charging output"
    excludes:
      - "drive belt replacement"
      - "battery replacement"
      - "belt tensioner replacement"
  - id: starter-replacement
    name: "Replace the starter motor"
    system: electrical
    components: [starter]
    includes:
      - "disconnect the battery"
      - "raise the vehicle where the starter is reached from below"
      - "remove parts in the way and unbolt the starter"
      - "fit the new starter and reconnect the cables"
      - "refit the parts removed and test the start"
    excludes:
      - "battery replacement"
      - "flywheel or flexplate repair"
  - id: spark-plugs
    name: "Replace spark plugs"
    system: electrical
    components: [spark-plug]
    includes:
      - "remove the engine covers, intake parts or coils in the way"
      - "remove all spark plugs"
      - "check the gap of the new plugs and fit them to torque"
      - "refit the coils, intake parts and covers"
      - "start the engine and check for misfires"
    excludes:
      - "ignition coil replacement"
      - "throttle body cleaning"
  - id: drive-belt-replacement
    name: "Replace the accessory drive belt"
    system: engine
    components: [drive-belt]
    includes:
      - "release the tensioner and remove the old belt"
      - "inspect the pulleys and tensioner"
      - "fit the new belt on its routing"
      - "start the engine and check the belt tracks"
    excludes:
      - "tensioner or idler pulley replacement"
      - "alternator replacement"
  - id: water-pump-replacement
    name: "Replace the water pump"
    system: engine
    components: [water-pump]
    related: [timing-belt-replacement]
    includes:
      - "drain the coolant"
      - "remove the drive belt, timing parts or other parts in the way"
      - "remove the old pump and clean the sealing faces"
      - "fit the new pump and gasket"
      - "refit the parts removed"
      - "refill and bleed the cooling system and check for leaks"
    excludes:
      - "timing belt replacement"
      - "thermostat replacement"
      - "radiator replacement"
      - "resealing the engine front cover, where the pump comes off without removing it"
  - id: timing-belt-replacement
    name: "Replace the timing belt"
    system: engine
    components: [timing-belt]
    related: [water-pump-replacement]
    includes:
      - "remove the drive belts, covers, engine mount and parts in the way"
      - "set the engine at its timing marks"
      - "remove the old belt, tensioner and idler"
      - "fit the new belt, tensioner and idler and check the timing"
      - "refit everything removed"
      - "start the engine and check it runs and idles correctly"
    excludes:
      - "water pump replacement"
      - "camshaft or crankshaft seal replacement"
      - "drive belt replacement"
  - id: radiator-replacement
    name: "Replace the radiator"
    system: engine
    components: [radiator]
    includes:
      - "drain the coolant"
      - "remove the fans, shrouds, hoses and cooler lines in the way"
      - "remove the old radiator"
      - "fit the new radiator and refit the parts removed"
      - "refill and bleed the cooling system and check for leaks"
    excludes:
      - "thermostat replacement"
      - "hose replacement"
      - "A/C condenser replacement"
  - id: struts-front
    name: "Replace front struts"
    system: suspension
    components: [shock-strut]
    includes:
      - "raise the vehicle and remove the front wheels"
      - "disconnect the sway bar link, brake hose bracket and sensors on the strut"
      - "remove both strut assemblies"
      - "fit new complete struts, or move the spring and mount to the new strut"
      - "refit the struts and wheels, torque at ride height"
      - "road test"
    excludes:
      - "wheel alignment"
      - "sway bar link replacement"
      - "strut mount replacement on its own"
  - id: shocks-rear
    name: "Replace rear shock absorbers"
    system: suspension
    components: [shock-strut]
    includes:
      - "raise the vehicle and support the rear axle or suspension"
      - "remove trim or parts in the way of the upper mounts"
      - "remove both rear shocks"
      - "fit the new shocks and torque at ride height"
      - "road test"
    excludes:
      - "rear spring replacement"
      - "wheel alignment"
  - id: wheel-bearing-front
    name: "Replace a front wheel bearing"
    system: suspension
    components: [wheel-bearing]
    includes:
      - "raise the vehicle and remove the wheel"
      - "remove the brake caliper, bracket and rotor"
      - "disconnect the wheel speed sensor"
      - "remove the hub or press out the bearing"
      - "fit the new hub or press in the new bearing"
      - "refit everything and torque the axle nut"
      - "road test"
    excludes:
      - "wheel alignment"
      - "brake pad or rotor replacement"
      - "axle shaft replacement"
  - id: wheel-bearing-rear
    name: "Replace a rear wheel bearing"
    system: suspension
    components: [wheel-bearing]
    includes:
      - "raise the vehicle and remove the wheel"
      - "remove the brake caliper, bracket and rotor or drum"
      - "disconnect the wheel speed sensor"
      - "remove the hub or press out the bearing"
      - "fit the new hub or press in the new bearing"
      - "refit everything and torque the fasteners"
      - "road test"
    excludes:
      - "wheel alignment"
      - "brake pad, rotor or shoe replacement"
  - id: tie-rod-end
    name: "Replace an outer tie rod end"
    system: steering
    components: [tie-rod]
    includes:
      - "raise the vehicle and remove the wheel"
      - "mark or measure the tie rod end's position"
      - "separate the tie rod end from the knuckle"
      - "fit the new tie rod end at the same length"
      - "torque and fit the cotter pin or lock nut"
      - "refit the wheel"
    excludes:
      - "wheel alignment"
      - "inner tie rod replacement"
  - id: ac-compressor-replacement
    name: "Replace the A/C compressor"
    system: hvac
    components: [ac-compressor]
    includes:
      - "recover the refrigerant"
      - "remove the drive belt and parts in the way"
      - "disconnect the lines and electrical connector and remove the compressor"
      - "fit the new compressor with new seals and the right oil charge"
      - "replace the receiver drier or accumulator and the orifice tube where fitted"
      - "evacuate, recharge and check the system's performance"
    excludes:
      - "condenser replacement"
      - "system flush"
      - "leak repair elsewhere in the system"
  - id: fuel-pump-replacement
    name: "Replace the fuel pump"
    system: fuel-system
    components: [fuel-pump]
    includes:
      - "relieve the fuel pressure and disconnect the battery"
      - "reach the pump through the access panel or by lowering the tank"
      - "disconnect the lines and connector and remove the pump module"
      - "fit the new pump or module with a new seal"
      - "refit the tank or panel"
      - "check the fuel pressure, start the engine and check for leaks"
    excludes:
      - "fuel tank replacement"
      - "fuel filter replacement where it is separate"
  - id: oxygen-sensor-replacement
    name: "Replace an oxygen sensor"
    system: exhaust-emissions
    components: [oxygen-sensor]
    related: [oxygen-sensor-upstream-bank-1, oxygen-sensor-upstream-bank-2, oxygen-sensor-downstream-bank-1, oxygen-sensor-downstream-bank-2]
    includes:
      - "raise the vehicle where the sensor is reached from below"
      - "unplug the sensor"
      - "remove the old sensor"
      - "fit the new sensor with anti-seize where it is not pre-coated"
      - "reconnect, clear the codes and check the readings"
    excludes:
      - "exhaust repair"
      - "catalytic converter replacement"
  - id: oxygen-sensor-upstream-bank-1
    name: "Replace the oxygen sensor before the catalytic converter, bank 1"
    system: exhaust-emissions
    components: [oxygen-sensor]
    related: [oxygen-sensor-upstream-bank-2, oxygen-sensor-downstream-bank-1, oxygen-sensor-downstream-bank-2, oxygen-sensor-replacement]
    includes:
      - "the sensor ahead of the catalytic converter on bank 1, the side with cylinder 1 (the only bank of an inline engine)"
      - "raise the vehicle where the sensor is reached from below"
      - "remove the parts in the way, or lower the subframe, where the sensor cannot be reached otherwise"
      - "unplug the sensor and remove it"
      - "fit the new sensor with anti-seize where it is not pre-coated"
      - "refit the parts removed, reconnect, clear the codes and check the readings"
    excludes:
      - "the other oxygen sensors"
      - "exhaust repair"
      - "catalytic converter replacement"
  - id: oxygen-sensor-upstream-bank-2
    name: "Replace the oxygen sensor before the catalytic converter, bank 2"
    system: exhaust-emissions
    components: [oxygen-sensor]
    related: [oxygen-sensor-upstream-bank-1, oxygen-sensor-downstream-bank-1, oxygen-sensor-downstream-bank-2, oxygen-sensor-replacement]
    includes:
      - "the sensor ahead of the catalytic converter on bank 2, the side without cylinder 1 (V and flat engines only)"
      - "raise the vehicle where the sensor is reached from below"
      - "remove the parts in the way, or lower the subframe, where the sensor cannot be reached otherwise"
      - "unplug the sensor and remove it"
      - "fit the new sensor with anti-seize where it is not pre-coated"
      - "refit the parts removed, reconnect, clear the codes and check the readings"
    excludes:
      - "the other oxygen sensors"
      - "exhaust repair"
      - "catalytic converter replacement"
  - id: oxygen-sensor-downstream-bank-1
    name: "Replace the oxygen sensor after the catalytic converter, bank 1"
    system: exhaust-emissions
    components: [oxygen-sensor]
    related: [oxygen-sensor-upstream-bank-1, oxygen-sensor-upstream-bank-2, oxygen-sensor-downstream-bank-2, oxygen-sensor-replacement]
    includes:
      - "the sensor behind the catalytic converter of bank 1, the side with cylinder 1 (the only bank of an inline engine)"
      - "raise the vehicle where the sensor is reached from below"
      - "remove the parts in the way, such as a heat shield, where the sensor cannot be reached otherwise"
      - "unplug the sensor and remove it"
      - "fit the new sensor with anti-seize where it is not pre-coated"
      - "refit the parts removed, reconnect, clear the codes and check the readings"
    excludes:
      - "the other oxygen sensors"
      - "exhaust repair"
      - "catalytic converter replacement"
  - id: oxygen-sensor-downstream-bank-2
    name: "Replace the oxygen sensor after the catalytic converter, bank 2"
    system: exhaust-emissions
    components: [oxygen-sensor]
    related: [oxygen-sensor-upstream-bank-1, oxygen-sensor-upstream-bank-2, oxygen-sensor-downstream-bank-1, oxygen-sensor-replacement]
    includes:
      - "the sensor behind the catalytic converter of bank 2, the side without cylinder 1 (V and flat engines only)"
      - "raise the vehicle where the sensor is reached from below"
      - "remove the parts in the way, such as a heat shield, where the sensor cannot be reached otherwise"
      - "unplug the sensor and remove it"
      - "fit the new sensor with anti-seize where it is not pre-coated"
      - "refit the parts removed, reconnect, clear the codes and check the readings"
    excludes:
      - "the other oxygen sensors"
      - "exhaust repair"
      - "catalytic converter replacement"
  # Added 2026-11-01, drafted by Claude for the owner's review: the big jobs whose
  # time varies most between vehicles (tier 1 of wenmar-labor's jobs-proposed.md).
  - id: heater-core-replacement
    name: "Replace the heater core"
    system: hvac
    components: [cooling-system]
    includes:
      - "recover the refrigerant where the evaporator case must open"
      - "drain the coolant and disconnect the heater hoses at the firewall"
      - "remove the dash, console or panels in the way of the heater case"
      - "open the case and replace the heater core"
      - "refit everything removed, refill and bleed the cooling system"
      - "recharge the A/C where it was opened, and check heat and air"
    excludes:
      - "heater hose replacement"
      - "evaporator replacement"
      - "coolant exchange"
  - id: timing-chain-replacement
    name: "Replace the timing chains, guides and tensioners"
    system: engine
    components: [engine-oil]
    related: [timing-belt-replacement, water-pump-replacement]
    includes:
      - "every timing chain of the engine, with its guides, tensioners and sprockets"
      - "remove what is in the way of the timing cover, such as belts, pulleys and mounts"
      - "remove the timing cover, or the engine or transmission where the chains sit at the back"
      - "set the engine to its timing marks and fit the new chains"
      - "refit the cover with new seals, refill oil and coolant"
      - "start the engine and check for codes and leaks"
    excludes:
      - "water pump replacement"
      - "camshaft or phaser replacement"
  - id: intake-manifold-gasket
    name: "Replace the intake manifold gaskets"
    system: engine
    related: [fuel-injector-replacement, knock-sensor-replacement]
    includes:
      - "remove the upper and lower intake manifold of the engine"
      - "disconnect the throttle body, fuel rail, vacuum lines and wiring in the way"
      - "drain the coolant where it runs through the manifold"
      - "clean the sealing faces and fit new gaskets"
      - "refit, refill and bleed the coolant, and check for leaks"
    excludes:
      - "knock sensor replacement"
      - "fuel injector replacement"
      - "cylinder head work"
  - id: valve-cover-gasket-bank-1
    name: "Replace the valve cover gasket, bank 1"
    system: engine
    related: [valve-cover-gasket-bank-2, spark-plugs]
    includes:
      - "the cover on bank 1, the side with cylinder 1 (the only cover of an inline engine)"
      - "remove the coils, wiring, hoses and parts in the way, such as an intake plenum"
      - "remove the cover, clean the sealing faces"
      - "fit a new cover gasket and spark plug tube seals where fitted"
      - "refit everything removed and check for leaks"
    excludes:
      - "the other bank's cover"
      - "spark plug replacement"
  - id: valve-cover-gasket-bank-2
    name: "Replace the valve cover gasket, bank 2"
    system: engine
    related: [valve-cover-gasket-bank-1, spark-plugs]
    includes:
      - "the cover on bank 2, the side without cylinder 1 (V and flat engines only)"
      - "remove the coils, wiring, hoses and parts in the way, such as an intake plenum"
      - "remove the cover, clean the sealing faces"
      - "fit a new cover gasket and spark plug tube seals where fitted"
      - "refit everything removed and check for leaks"
    excludes:
      - "the other bank's cover"
      - "spark plug replacement"
  - id: oil-pan-gasket
    name: "Replace the oil pan gasket"
    system: engine
    components: [engine-oil]
    includes:
      - "raise the vehicle and drain the engine oil"
      - "remove what is in the way of the pan: a crossmember or steering parts; lower the subframe or raise the engine"
      - "remove the pan, clean the sealing faces and fit a new gasket or sealant"
      - "refit everything removed and refill the oil"
      - "start the engine and check for leaks"
    excludes:
      - "oil service"
      - "rear main seal replacement"
  - id: clutch-replacement
    name: "Replace the clutch"
    system: powertrain
    components: [clutch, manual-transmission]
    includes:
      - "remove the transmission or transaxle, with the axles or driveshaft in the way"
      - "replace the clutch disc, pressure plate and release bearing"
      - "check the flywheel and fit a new pilot bearing where used"
      - "refit the transmission and bleed or adjust the clutch"
      - "road test"
    excludes:
      - "flywheel replacement or machining"
      - "clutch master or slave cylinder replacement"
  - id: steering-rack-replacement
    name: "Replace the steering rack"
    system: steering
    components: [steering-gear, power-steering]
    related: [tie-rod-end]
    includes:
      - "raise the vehicle and disconnect the tie rod ends and the steering shaft"
      - "disconnect the fluid lines or the electric assist wiring"
      - "lower the subframe where the rack cannot come out otherwise"
      - "replace the rack, moving over the outer tie rod ends"
      - "refit everything removed, fill and bleed the fluid, and centre the steering"
    excludes:
      - "wheel alignment"
      - "tie rod end replacement"
  - id: exhaust-manifold-bank-1
    name: "Replace the exhaust manifold, bank 1"
    system: exhaust-emissions
    components: [exhaust-pipe]
    related: [exhaust-manifold-bank-2, catalytic-converter-replacement]
    includes:
      - "the manifold on bank 1, the side with cylinder 1 (the only manifold of an inline engine)"
      - "remove the heat shields, sensors and parts in the way"
      - "separate the manifold from the down pipe or converter"
      - "remove the manifold, with broken studs extracted where they snap"
      - "fit the new manifold with new gaskets and refit everything removed"
      - "start the engine and check for leaks"
    excludes:
      - "the other bank's manifold"
      - "catalytic converter replacement"
      - "oxygen sensor replacement"
  - id: exhaust-manifold-bank-2
    name: "Replace the exhaust manifold, bank 2"
    system: exhaust-emissions
    components: [exhaust-pipe]
    related: [exhaust-manifold-bank-1, catalytic-converter-replacement]
    includes:
      - "the manifold on bank 2, the side without cylinder 1 (V and flat engines only)"
      - "remove the heat shields, sensors and parts in the way"
      - "separate the manifold from the down pipe or converter"
      - "remove the manifold, with broken studs extracted where they snap"
      - "fit the new manifold with new gaskets and refit everything removed"
      - "start the engine and check for leaks"
    excludes:
      - "the other bank's manifold"
      - "catalytic converter replacement"
      - "oxygen sensor replacement"
  - id: catalytic-converter-replacement
    name: "Replace the catalytic converter"
    system: exhaust-emissions
    components: [catalytic-converter]
    related: [exhaust-manifold-bank-1]
    includes:
      - "the main converter of bank 1, or the only one; a converter built into the manifold counts"
      - "raise the vehicle and remove the heat shields and supports in the way"
      - "move over the oxygen sensors"
      - "replace the converter with new gaskets or clamps"
      - "start the engine and check for leaks and codes"
    excludes:
      - "oxygen sensor replacement"
      - "exhaust pipe or muffler replacement"
  - id: fuel-injector-replacement
    name: "Replace the fuel injectors"
    system: fuel-system
    components: [fuel-injector]
    related: [intake-manifold-gasket]
    includes:
      - "every injector of the engine"
      - "relieve the fuel pressure"
      - "remove the intake parts in the way of the fuel rail"
      - "remove the rail and injectors, fit new injectors with new seals"
      - "code the injectors to the engine computer where it is required"
      - "refit everything removed, prime the fuel system and check for leaks"
    excludes:
      - "fuel pump replacement"
      - "intake manifold gasket replacement"
  - id: camshaft-position-sensor-bank-1
    name: "Replace a camshaft position sensor, bank 1"
    system: engine
    components: [engine-control-module]
    related: [camshaft-position-sensor-bank-2]
    includes:
      - "one camshaft sensor of bank 1, the side with cylinder 1, the hardest to reach where it has several"
      - "remove the parts in the way, such as an intake duct or a cover"
      - "unplug and replace the sensor with a new seal"
      - "refit everything removed and clear the codes"
    excludes:
      - "the other camshaft sensors"
      - "crankshaft position sensor replacement"
  - id: camshaft-position-sensor-bank-2
    name: "Replace a camshaft position sensor, bank 2"
    system: engine
    components: [engine-control-module]
    related: [camshaft-position-sensor-bank-1]
    includes:
      - "one camshaft sensor of bank 2, the side without cylinder 1 (V and flat engines only), the hardest to reach"
      - "remove the parts in the way, such as an intake duct or a cover"
      - "unplug and replace the sensor with a new seal"
      - "refit everything removed and clear the codes"
    excludes:
      - "the other camshaft sensors"
      - "crankshaft position sensor replacement"
  - id: knock-sensor-replacement
    name: "Replace the knock sensors"
    system: engine
    components: [engine-control-module]
    related: [intake-manifold-gasket]
    includes:
      - "every knock sensor of the engine"
      - "remove the intake manifold or other parts in the way where the sensors sit under them"
      - "replace the sensors, and their harness where it comes with them"
      - "refit everything removed with new gaskets, and clear the codes"
    excludes:
      - "intake manifold gasket replacement on its own"
  # Small jobs: one reference time for every vehicle (wenmar-labor's
  # data/labor/reference.yaml), never asked vehicle by vehicle.
  - id: wiper-blades
    name: "Replace the front wiper blades"
    system: visibility
    components: [wiper]
    includes:
      - "remove the old front blades"
      - "fit the new blades and check they clear the glass"
    excludes:
      - "rear wiper blade"
      - "wiper arm or motor replacement"
  - id: engine-air-filter
    name: "Replace the engine air filter"
    system: engine
    includes:
      - "open the air filter housing"
      - "replace the filter and clean the housing"
      - "close the housing and check the duct clamps"
    excludes:
      - "cabin air filter replacement"
  - id: cabin-air-filter
    name: "Replace the cabin air filter"
    system: hvac
    includes:
      - "remove the glovebox, cowl or panel over the filter"
      - "replace the filter"
      - "refit everything removed"
    excludes:
      - "engine air filter replacement"
  - id: headlight-bulb
    name: "Replace a headlight bulb"
    system: lighting
    components: [headlight]
    includes:
      - "one bulb of one headlight"
      - "remove the cover, duct or part in the way of the bulb"
