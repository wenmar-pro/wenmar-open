# The sales taxes and the new-tire fees on a retail repair invoice, for each
# Canadian province and territory.
#
# This is the one place a rate, a rule or a fee is written. The server's
# build reads it (crates/open-server/rates_build.rs) and stops if it is not
# as described here, so a mistake never reaches a visitor.
#
# Change it only from a source: the tax authority's or the stewardship
# body's own page, read in full. Then set `as_of` to the day it was read.
# Check every entry when a rate changes and at least once a year.
#
# The schema
#
#   schema, currency      1 and "CAD".
#   [source.<id>]         A page a figure was read from. `title` says whose
#                         page it is and what it is; `url` is its address.
#                         `archived` is there when the page could not be
#                         read directly and the Internet Archive's copy of
#                         that date (a year, a month or a day) was read.
#   [[province]]          `code`, `name`, `as_of` (the day the entry was
#                         checked) and `confirmed`.
#     confirmed           true only when every rule the calculator uses for
#                         the province has a source. The calculator works
#                         nothing out for a province that is not confirmed.
#     missing             What is not yet known. Empty when confirmed.
#     notes               Sentences the page shows with the result.
#     to_check            Weak points in the evidence, for whoever checks
#                         the file next. Not shown.
#   [[province.tax]]      `name`, `rate` (a percent, as text), and whether
#                         the tax is charged on labour, on parts, on a shop
#                         supplies charge and on the tire fee.
#     on_other_taxes      Whether the tax is calculated on a price that
#                         already holds another tax. It is false
#                         everywhere, and the build refuses true: the
#                         calculator has no arithmetic for it.
#     sources             The ids of the pages that state the rate and each
#                         rule. At least one.
#   [[province.tire_fee]] One class of new tire: `class` (the name of its
#                         field in the page's address: small letters,
#                         digits and _), `label` (what a shop would call
#                         it, to follow the words "New tires:"), `amount`
#                         (dollars, as text), `effective` (the day the
#                         amount took effect, when a source gives it) and
#                         `sources`.
#   [province.no_tire_fee] In place of tire fees, for a province that is
#                         known to set none: `statement` (shown on the
#                         page) and `sources`.

schema = 1
currency = "CAD"

