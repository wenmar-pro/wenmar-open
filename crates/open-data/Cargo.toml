[package]
name = "open-data"
version = "0.1.0"
description = "Builds the Wenmar Open data file from NHTSA's vPIC release."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { workspace = true, features = ["derive"] }
serde-saphyr = "1.3.0"
serde_json.workspace = true
ureq = "3.4.2"
wenmar-vehicles = { version = "0.1.0", path = "../wenmar-vehicles" }
wenmar-vin = { path = "../wenmar-vin", features = ["sqlite"] }
zip = "8.6.0"
