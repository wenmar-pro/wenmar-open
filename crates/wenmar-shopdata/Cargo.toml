[package]
name = "wenmar-shopdata"
version.workspace = true
description = "Reads a Wenmar Open shop file: recalls, bulletins, trouble codes and fuel data matched to the vehicle catalog."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
publish = false

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"], optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
wenmar-vehicles.workspace = true

[features]
sqlite = ["dep:rusqlite"]

[[test]]
name = "shop"
required-features = ["sqlite"]

[[test]]
name = "recalls"
required-features = ["sqlite"]

[[test]]
name = "fuel"
required-features = ["sqlite"]

[[test]]
name = "hand"
required-features = ["sqlite"]

[[test]]
name = "investigations"
required-features = ["sqlite"]

[[test]]
name = "recall_reports"
required-features = ["sqlite"]

[[test]]
name = "ratings"
required-features = ["sqlite"]

[[test]]
name = "vin_guides"
required-features = ["sqlite"]


[[test]]
name = "bulletins"
required-features = ["sqlite"]

[[test]]
name = "siblings"
required-features = ["sqlite"]

[[test]]
name = "complaints"
required-features = ["sqlite"]


[[test]]
name = "codes"
required-features = ["sqlite"]
