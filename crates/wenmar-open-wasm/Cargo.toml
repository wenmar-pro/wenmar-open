[package]
name = "wenmar-open-wasm"
version.workspace = true
description = "wenmar-vin and wenmar-vehicles behind one JSON call: the WebAssembly the wenmar-open npm package runs offline."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[lib]
# cdylib is the .wasm; rlib lets the tests in tests/ run natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
wenmar-vehicles.workspace = true
# Without its `sqlite` feature: the shop file is read through the rows the
# caller sends, as the data file is.
wenmar-shopdata = { path = "../wenmar-shopdata" }
wenmar-vin.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
wenmar-vehicles = { workspace = true, features = ["sqlite"] }
wenmar-vin = { workspace = true, features = ["sqlite"] }
