[package]
name = "wenmar-open-turso"
version.workspace = true
description = "Reads a Wenmar Open data file through the turso crate: VIN decoding and the vehicle catalog in-process, read-only, from async code."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
keywords = ["vin", "vehicle", "automotive", "turso", "sqlite"]
categories = ["database"]

[dependencies]
serde.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync"] }
# No features of its own: the data file is plain SQLite. The program that
# uses this crate chooses turso's features, and cargo builds turso once.
turso = { version = "0.8.1", default-features = false }
wenmar-vehicles.workspace = true
wenmar-vin.workspace = true

[dev-dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde_json.workspace = true
tempfile = "3.27.0"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
wenmar-vehicles = { workspace = true, features = ["sqlite"] }
wenmar-vin = { workspace = true, features = ["sqlite"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
