[package]
name = "open-server"
version.workspace = true
description = "The Wenmar Open website and JSON API."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
askama = "0.14"
axum = { version = "0.8", default-features = false, features = ["form", "http1", "json", "matched-path", "query", "tokio"] }
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
open-mcp = { path = "../open-mcp" }
payroll-calc = { path = "../payroll-calc", features = ["openapi"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde.workspace = true
serde_json.workspace = true
shop-math = { path = "../shop-math" }
thiserror.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["cors", "catch-panic"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
ureq = { version = "3", default-features = false, features = ["rustls"] }
utoipa = { version = "5", features = ["axum_extras"] }
utoipa-axum = "0.2"
wenmar-open-db.workspace = true
wenmar-shopdata = { path = "../wenmar-shopdata", features = ["sqlite"] }
wenmar-vehicles.workspace = true
wenmar-vin.workspace = true

[build-dependencies]
basic-toml = "0.1.10"
serde.workspace = true
serde-saphyr = "1.3.0"
shop-math = { path = "../shop-math" }

[dev-dependencies]
basic-toml = "0.1.10"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde-saphyr = "1.3.0"
http-body-util = "0.1.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
tempfile = "3.27.0"
tokio = { version = "1", features = ["test-util"] }
wenmar-open-cli = { path = "../wenmar-open-cli" }
wenmar-open-wasm = { path = "../wenmar-open-wasm" }
wenmar-vehicles = { workspace = true, features = ["sqlite"] }
wenmar-vin = { workspace = true, features = ["sqlite"] }

[[test]]
name = "it"
path = "tests/it/main.rs"
