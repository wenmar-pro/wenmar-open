{% extends "base.html" %}
{% block content %}
<h1>Decode a VIN</h1>
{% include "vin_form.html" %}
<h2 id="pick-heading">No VIN? Pick the vehicle</h2>
<form class="pick" action="/pick" method="get" aria-labelledby="pick-heading">
<label for="year">Year</label>
<select id="year" name="year">
{% for year in years -%}
<option value="{{ year }}">{{ year }}</option>
{% endfor -%}
</select>
<label for="make">Make</label>
<select id="make" name="make">
<option value="">Every make</option>
{% for make in makes -%}
<option value="{{ make.id }}">{{ make.name }}</option>
{% endfor -%}
</select>
<button type="submit">Show models</button>
</form>
<p class="note">Free, with no account and no key. The data is what manufacturers reported to NHTSA.</p>
{% endblock %}
