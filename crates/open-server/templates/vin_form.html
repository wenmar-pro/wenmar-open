<form class="vin" action="/vin" method="get">
<label for="vin">VIN</label>
<input id="vin" name="vin" type="text" required maxlength="40" autocomplete="off" autocapitalize="characters" autocorrect="off" spellcheck="false" enterkeyhint="go" aria-describedby="vin-help">
<button class="primary" type="submit">Decode</button>
<p class="help" id="vin-help">17 characters, from the driver's door jamb, the dash at the windshield, or the ownership. Spaces and dashes are fine.</p>
</form>
