name: Bug report
description: Something is broken in the API, website, crate, or npm client.
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Where is the problem?
      options:
        - Website
        - JSON API
        - Rust crate (wenmar-vin)
        - npm client
        - Data build
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Include the request or code you ran and the full response or error.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Crate or package version, or the data version from the API response.
