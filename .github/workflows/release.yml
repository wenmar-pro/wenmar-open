name: Release

# A tag v<version> on main publishes that version:
#
#   verify    the tag is on main and names the version in the manifests;
#             the checks CI runs; scripts/release-check.sh
#   crates    wenmar-vin, wenmar-vehicles, wenmar-open-turso to crates.io
#   npm       wenmar-open to npm, with provenance
#             The package holds the decoder as WebAssembly, built in that
#             job from the tagged commit.
#   release   a GitHub release whose notes are the changelog's section
#   binaries  the wenmar-open command-line tool for macOS and Linux, attached
#             to the release, then SHA256SUMS
#
# No registry token is stored. crates.io and npm each trust this file, in
# this repository, in the environment `release` (trusted publishing over
# OIDC). The one-time setup is in docs/releasing.md. Renaming this file or
# the environment breaks that trust until both registries are told.
#
# Every publishing step first asks the registry whether the version is
# already there and skips it if so, so a run that failed can be run again.
#
# Every action is pinned to a commit, with its version in a comment, and no
# checkout keeps its credentials: the crates and npm jobs can ask a registry
# for a publishing token, so the code they run must not change under a tag.
# scripts/release-check.sh fails if either stops being true. To move to a
# newer version, change the commit and the comment together.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The checkout kept no credentials. The repository is public, so this
      # fetch needs none.
      - name: The tag is a commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. A release is tagged on main." >&2
            exit 1
          fi

      - name: The version this tag names
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      - name: Test the npm client
        working-directory: clients/js
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Release check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHECK_FULL: "1"
        run: scripts/release-check.sh

  crates:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Which crates are not on crates.io at this version
        id: pending
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          pending=""
          for crate in wenmar-vin wenmar-vehicles wenmar-open-turso; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "wenmar-open release workflow (https://github.com/wenmar-pro/wenmar-open)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$code" in
              200) echo "$crate $VERSION is already on crates.io." ;;
              404) pending="$pending $crate" ;;
              *)
                echo "crates.io answered $code for $crate $VERSION." >&2
                exit 1
                ;;
            esac
          done
          echo "To publish:${pending:- nothing}"
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Ask crates.io for a short-lived token
        id: auth
        if: steps.pending.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish, in dependency order
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            cargo publish --locked -p "$crate"
          done

  npm:
    needs: [verify, crates]
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          version=$(npm --version)
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const enough = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!enough) {
              console.error("Trusted publishing needs npm 11.5.1 or later.");
              process.exit(1);
            }
          ' "$version"

      # npm test and npm publish (through prepack) build the WebAssembly.
      - name: Install pinned toolchain
        run: rustup toolchain install

      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Publish, unless this version is already on npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          published=$(npm view "wenmar-open@$VERSION" version 2>/dev/null || true)
          if [ "$published" = "$VERSION" ]; then
            echo "wenmar-open $VERSION is already on npm."
            exit 0
          fi
          npm publish --provenance --access public

  release:
    needs: [verify, npm]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Create the GitHub release, unless it exists
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The release v$VERSION already exists."
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          {
            echo
            echo "Crates: [wenmar-vin](https://crates.io/crates/wenmar-vin/$VERSION), [wenmar-vehicles](https://crates.io/crates/wenmar-vehicles/$VERSION), [wenmar-open-turso](https://crates.io/crates/wenmar-open-turso/$VERSION)."
            echo "npm: [wenmar-open](https://www.npmjs.com/package/wenmar-open/v/$VERSION)."
          } >> notes.md
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest

  binaries:
    needs: [verify, release]
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-22.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-22.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned toolchain and the target
        run: |
          set -euo pipefail
          rustup toolchain install
          rustup target add "$TARGET"

      - name: Build
        run: cargo build --release --locked -p wenmar-open-cli --bin wenmar-open --target "$TARGET"

      # The x86_64 macOS binary cannot be run on the arm64 runner without
      # Rosetta, so it is built and not run.
      - name: The binary says its version
        if: matrix.target != 'x86_64-apple-darwin'
        run: |
          set -euo pipefail
          "target/$TARGET/release/wenmar-open" --version
          "target/$TARGET/release/wenmar-open" --version | grep -F "$VERSION"

      - name: Package and attach
        run: |
          set -euo pipefail
          archive="wenmar-open-$TARGET.tar.gz"
          tar -czf "$archive" -C "target/$TARGET/release" wenmar-open
          gh release upload "v$VERSION" "$archive" --clobber

  checksums:
    needs: [verify, binaries]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - name: Write SHA256SUMS from the attached archives
        run: |
          set -euo pipefail
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY" --pattern 'wenmar-open-*.tar.gz'
          ls -l
          count=$(ls wenmar-open-*.tar.gz | wc -l)
          if [ "$count" -ne 4 ]; then
            echo "Expected 4 archives on the release, found $count." >&2
            exit 1
          fi
          sha256sum wenmar-open-*.tar.gz > SHA256SUMS
          cat SHA256SUMS
          gh release upload "v$VERSION" SHA256SUMS --repo "$GITHUB_REPOSITORY" --clobber
