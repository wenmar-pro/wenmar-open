name: Release

# A tag v<version> on main publishes that version:
#
#   verify    the tag is on main and names the version in the manifests;
#             the checks CI runs; scripts/release-check.sh
#   crates    wenmar-vin, wenmar-vehicles, wenmar-open-turso to crates.io
#   npm       wenmar-open to npm, with provenance
#   release   a GitHub release whose notes are the changelog's section
#
# No registry token is stored. crates.io and npm each trust this file, in
# this repository, in the environment `release` (trusted publishing over
# OIDC). The one-time setup is in docs/releasing.md. Renaming this file or
# the environment breaks that trust until both registries are told.
#
# Every publishing step first asks the registry whether the version is
# already there and skips it if so, so a run that failed can be run again.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: The tag is a commit on main
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "$GITHUB_REF_NAME is not on main. A release is tagged on main." >&2
            exit 1
          fi

      - name: The version this tag names
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Install pinned toolchain
        run: rustup toolchain install

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features

      - name: Test the npm client
        working-directory: clients/js
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Release check
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_CHECK_FULL: "1"
        run: scripts/release-check.sh

  crates:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install pinned toolchain
        run: rustup toolchain install

      - name: Which crates are not on crates.io at this version
        id: pending
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          pending=""
          for crate in wenmar-vin wenmar-vehicles wenmar-open-turso; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -A "wenmar-open release workflow (https://github.com/wenmar-pro/wenmar-open)" \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            case "$code" in
              200) echo "$crate $VERSION is already on crates.io." ;;
              404) pending="$pending $crate" ;;
              *)
                echo "crates.io answered $code for $crate $VERSION." >&2
                exit 1
                ;;
            esac
          done
          echo "To publish:${pending:- nothing}"
          echo "crates=${pending# }" >> "$GITHUB_OUTPUT"

      - name: Ask crates.io for a short-lived token
        id: auth
        if: steps.pending.outputs.crates != ''
        uses: rust-lang/crates-io-auth-action@v1

      - name: Publish, in dependency order
        if: steps.pending.outputs.crates != ''
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          CRATES: ${{ steps.pending.outputs.crates }}
        run: |
          set -euo pipefail
          for crate in $CRATES; do
            cargo publish --locked -p "$crate"
          done

  npm:
    needs: [verify, crates]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: release
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: npm is new enough for trusted publishing
        run: |
          set -euo pipefail
          version=$(npm --version)
          echo "npm $version"
          node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const enough = major > 11 || (major === 11 && (minor > 5 || (minor === 5 && patch >= 1)));
            if (!enough) {
              console.error("Trusted publishing needs npm 11.5.1 or later.");
              process.exit(1);
            }
          ' "$version"

      - run: npm ci --no-audit --no-fund
      - run: npm test

      - name: Publish, unless this version is already on npm
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          published=$(npm view "wenmar-open@$VERSION" version 2>/dev/null || true)
          if [ "$published" = "$VERSION" ]; then
            echo "wenmar-open $VERSION is already on npm."
            exit 0
          fi
          npm publish --provenance --access public

  release:
    needs: [verify, npm]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Create the GitHub release, unless it exists
        run: |
          set -euo pipefail
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "The release v$VERSION already exists."
            exit 0
          fi
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed -e '/./,$!d' > notes.md
          {
            echo
            echo "Crates: [wenmar-vin](https://crates.io/crates/wenmar-vin/$VERSION), [wenmar-vehicles](https://crates.io/crates/wenmar-vehicles/$VERSION), [wenmar-open-turso](https://crates.io/crates/wenmar-open-turso/$VERSION)."
            echo "npm: [wenmar-open](https://www.npmjs.com/package/wenmar-open/v/$VERSION)."
          } >> notes.md
          gh release create "v$VERSION" \
            --verify-tag \
            --title "v$VERSION" \
            --notes-file notes.md \
            --latest
