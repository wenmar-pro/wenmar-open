name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Not a size question but a correctness one. The two release test
          # scripts clone this checkout and push tags and branches from the
          # clone into a bare repository of their own. actions/checkout
          # defaults to fetch-depth 1, a clone of a shallow repository is
          # shallow too, and git refuses such a push with "shallow update not
          # allowed". Ask for the whole history, as release.yml does.
          fetch-depth: 0
          # Nothing here pushes to origin; keep the token out of .git/config.
          persist-credentials: false
      # The data files are never committed. A tracked path there (such as the
      # symlink a dangle worktree makes) replaces the real directory on the
      # next checkout, and git deletes the ignored data files to do it.
      - name: Nothing is tracked under data/build
        run: test -z "$(git ls-files data/build)" || { git ls-files data/build; exit 1; }
      - name: Install pinned toolchain
        run: rustup toolchain install
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      # Not part of cargo test, so mise run check does not run it. It clones
      # the repository and compiles into this runner's own target/, so it needs
      # the pinned toolchain the step above installed, and it must stay after
      # cargo test: a bumped version compiled in the clone is cached under the
      # new version's fingerprint, and cargo test would read it as this tree's.
      - run: scripts/release-bump-test.sh
      # The same reason, and it must stay after both cargo test and the bump
      # test above: this one makes a real release in its clone, so its target/
      # holds a bumped version too.
      - run: scripts/release-test.sh
      # This one builds and installs an npm package in its clone. It compiles
      # no Rust, so it is independent of the two above, but it still needs Node
      # and the data-file tables from the workspace.
      - run: scripts/release-data-test.sh

  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup toolchain install 1.92 --profile minimal
      - run: cargo +1.92 test --workspace --all-features

  js:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # The oldest Node the package supports, and the current LTS.
        node: ["20", "lts/*"]
    defaults:
      run:
        working-directory: clients/js
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # npm test builds crates/wenmar-open-wasm for wasm32-unknown-unknown,
      # which rust-toolchain.toml lists as a target.
      - name: Install pinned toolchain
        run: rustup toolchain install
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: clients/js/package-lock.json
      - run: npm ci --no-audit --no-fund
      # Also the size budget of the WebAssembly: test/package.test.ts.
      - run: npm test
      - name: Test the data package's scripts
        working-directory: clients/data
        run: node --test test/data.test.mjs

      - name: Test the shop data package's scripts
        working-directory: clients/data-shop
        run: node --test test/data-shop.test.mjs

      - name: Test the shop release scripts
        working-directory: ${{ github.workspace }}
        run: node --test scripts/shop-release.test.mjs
