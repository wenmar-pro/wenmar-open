# Tooling for this repository. Optional: without mise, rustup reads
# rust-toolchain.toml and the commands under [tasks] can be run by hand.

[tools]
rust = "1.99.0"   # keep in sync with rust-toolchain.toml
python = "3.14"   # tools/corpus, tools/catalog

[tasks.check]
description = "Format check, lints and tests: what CI runs"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets --all-features -- -D warnings",
  "cargo test --workspace --all-features",
]

[tasks.doctor]
description = "Check the data file and the API, and say which of them answers"
run = "cargo run -q -p wenmar-open-cli -- doctor"

[tasks.js]
description = "Build and test the npm packages in clients/js and clients/data (needs Node 20 or later and the Rust toolchain)"
dir = "{{config_root}}/clients/js"
run = ["npm ci --no-audit --no-fund", "npm test", "node --test ../data/test/data.test.mjs", "node --test ../data-shop/test/data-shop.test.mjs", "node --test ../../scripts/shop-release.test.mjs"]

[tasks.wasm]
description = "Build the WebAssembly of crates/wenmar-open-wasm (clients/js does this itself in npm run build)"
run = "cargo build --locked -p wenmar-open-wasm --lib --target wasm32-unknown-unknown --profile wasm"

[tasks.release-check]
description = "Check that a release would work: versions, changelog, dry runs. Publishes nothing"
depends = ["check", "js"]
run = "scripts/release-check.sh"

[tasks.release-bump]
description = "Bump every version, cut the changelog and record the data version. Commits nothing"
run = ["scripts/release-bump.sh"]

[tasks.release-data]
description = "Build and verify the wenmar-open-data npm package from a data release. Publishes nothing"
run = ["scripts/release-data.sh"]

[tasks.release-data-test]
description = "Test scripts/release-data.sh against the states it must refuse, and the package it must build"
run = ["scripts/release-data-test.sh"]

[tasks.release]
description = "Make the monthly release by hand: check, bump, cut the changelog, commit and tag. Pushes nothing"
run = ["scripts/release.sh"]

[tasks.release-test]
description = "Test scripts/release.sh against the states it must refuse, and the release it must make"
run = ["scripts/release-test.sh"]

[tasks.release-bump-test]
description = "Test scripts/release-bump.sh against the trees it must accept or refuse"
run = ["scripts/release-bump-test.sh"]

[tasks.data]
description = "Download NHTSA's newest vPIC release and build the data file"
run = '''
set -eu
dump=$(cargo run --release -q -p open-data -- fetch)
version=$(basename "$dump" .sql | sed 's/^vPICList_lite_//; s/_/./')
out="data/build/wenmar-open-$version.sqlite3"
rm -f "$out"
cargo run --release -q -p open-data -- build --dump "$dump" --out "$out"
'''

[tasks.shop-data]
description = "Build the shop file from the newest data file and the fetched sources in data/build"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
if [ -z "$data" ]; then
  echo "No data file in data/build. Run: mise run data" >&2
  exit 1
fi
version=$(date -u +%Y.%m.%d)
# In a directory of its own: everything that looks for the newest data file
# reads data/build/wenmar-open-*.sqlite3, and a shop file there would match.
mkdir -p data/build/shop
out="data/build/shop/wenmar-open-shop-$version.sqlite3"
rm -f "$out"
# The copy for the command-line tool and the npm package: the same file
# without the datasets only the hosted service carries (bulletins).
mkdir -p data/build/shop/offline
offline="data/build/shop/offline/wenmar-open-shop-$version.sqlite3"
rm -f "$offline"
# Each source that was fetched adds its dataset. One that was not is left
# out, and this says so.
sources=""
for source in nhtsa-recalls tc-recalls nhtsa-investigations nhtsa-recall-reports nhtsa-ratings nhtsa-vin-guides epa-vehicles epa-guide epa-emissions nrcan-fuel nhtsa-mfr-comms nhtsa-complaints; do
  if [ -f "data/build/sources/$source/source.json" ]; then
    sources="$sources --$source data/build/sources/$source"
  else
    echo "No data/build/sources/$source. To add its dataset: cargo run --release -p open-data -- fetch $source" >&2
  fi
done
# The flags are separate words, so $sources is not quoted.
cargo run --release -q -p open-data -- build-shop --catalog "$data" --out "$out" --offline-out "$offline" --data-version "$version" $sources
'''

[tasks.shop-pull]
description = "Fetch the full file of the newest shop data release that pairs with DATA_VERSION in config/deploy.yml, and name it there"
run = "node scripts/shop-pull.mjs"

[tasks.parity]
description = "Compare decodes with NHTSA's recorded answers"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
if [ -z "$data" ]; then
  echo "No data file in data/build. Run: mise run data" >&2
  exit 1
fi
cargo run --release -q -p open-data -- parity --data "$data"
'''

[tasks.catalog-parity]
description = "Compare the catalog's models with NHTSA's recorded answers"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
if [ -z "$data" ]; then
  echo "No data file in data/build. Run: mise run data" >&2
  exit 1
fi
cargo run --release -q -p open-data -- catalog-parity --data "$data"
'''

[tasks.check-links]
description = "Ask for every stored link to a maker's site, one at a time, and write data/build/link-report.md. Never fails because a link did"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
# With a data file, each address pattern in makes.yaml is tried on a few
# model years. Without one, only the addresses written out are asked for.
if [ -n "$data" ]; then
  cargo run --release -q -p open-data -- check-links --catalog "$data"
else
  cargo run --release -q -p open-data -- check-links
fi
'''

[tasks.coverage]
description = "Check how much of the newest shop file matched the catalog"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
# The full file. The pattern does not reach into data/build/shop/offline/,
# where the copy without bulletins is: data/coverage.yaml has a minimum for
# bulletins, which that copy would fail.
shop=$(ls data/build/shop/wenmar-open-shop-*.sqlite3 2>/dev/null | sort | tail -1)
if [ -z "$data" ] || [ -z "$shop" ]; then
  echo "No data file or no shop file. Run: mise run data, then mise run shop-data" >&2
  exit 1
fi
cargo run --release -q -p open-data -- coverage --shop "$shop" --catalog "$data"
'''


[tasks.serve]
description = "Run the website and the API on http://localhost:3000 with the newest data file in data/build, and the newest full shop file in data/build/shop if there is one"
run = '''
set -eu
data=$(ls data/build/wenmar-open-*.sqlite3 2>/dev/null | sort | tail -1)
if [ -z "$data" ]; then
  echo "No data file in data/build. Run: mise run data" >&2
  exit 1
fi
# The newest shop file, when there is one, so the recall pages can be looked
# at. It must have been built against the data file above, or the server says
# so and stops: build one with `mise run shop-data`.
# It is the full file, with bulletins, as the hosted server has. The pattern
# does not reach into data/build/shop/offline/, where the copy for the
# command-line tool and the npm package is.
shop=$(ls data/build/shop/wenmar-open-shop-*.sqlite3 2>/dev/null | sort -V | tail -1)
if [ -n "$shop" ]; then
  export OPEN_SHOP_DATA="$shop"
fi
OPEN_DATA="$data" OPEN_BASE_URL="http://localhost:${PORT:-3000}" cargo run -q -p open-server
'''

[tasks.tui]
description = "Open the one-screen terminal interface"
run = "cargo run -q -p wenmar-open-cli"

